<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <form>
        <h1>Formulário de Cadastro</h1>
        <label for="user">Nome:</label>
        <input type="text" id="user" name="user" placeholder="Digite seu nome"><br/>
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail"><br/>
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha"><br/>
        <button type="submit">Cadastrar-se</button>
    </form>
</body>
</html>
