<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ancizar+Serif:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Lista de tarefas</title>
</head>
<body>
    <div class="container">
        <header>
        <h1>Lista De Tarefas</h1>
            <form id="form-tarefas">
                <input type="text" id="nova-tarefa" required placeholder="Adicione uma Tarefa" />
                <button type="submit" id="botao-adicionar">Adicionar</button>
            </form>
        </header>
        <ul id="lista-de-tarefas"></ul>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
