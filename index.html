<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Números</title>
    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <div class="container">
    <h1>CAMPO DE NÚMEROS</h1> 
        <form id="formNumero">       
            <input type="number" id="campoA" required placeholder="Digite seu primeiro valor" />
            <p class="error-message"></p>
            <input type="number" id="campoB" required placeholder="Digite seu segundo valor" />
            <button id="btn-confirmar" type="submit">Confirmar</button>
        </form>
        <p class="sucess-message"></p>
    </div>
    <script src="./main.js"></script>
</body>
</html>
